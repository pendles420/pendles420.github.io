<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fujifilm Photos - Chris Carroll</title>
  <style>
    body {
      font-family: 'Helvetica', sans-serif;
      background-color: #FFFFFF;
      color: #666;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
      font-size: 16.1px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    h1 {
      font-size: 2em;
      text-transform: lowercase;
      margin-bottom: 10px;
    }

    .photo {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>photos from my fujifilm</h1>

    <!-- Add as many photos as you want below -->
    <img src="https://via.placeholder.com/800x600?text=Fujifilm+Photo+1" alt="Photo 1" class="photo">
    <img src="https://via.placeholder.com/800x600?text=Fujifilm+Photo+2" alt="Photo 2" class="photo">
    <img src="https://via.placeholder.com/800x600?text=Fujifilm+Photo+3" alt="Photo 3" class="photo">
    <img src="https://via.placeholder.com/800x600?text=Fujifilm+Photo+4" alt="Photo 4" class="photo">

  </div>
</body>
</html>
