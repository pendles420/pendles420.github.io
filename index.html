<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="https://i.ibb.co/XrD9y8Jq/e2072737-0213-4668-a900-77ac19758edb.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chris carroll's website</title>
  <style>
    body {
      font-family: 'Helvetica', sans-serif;
      background-color: #FFFFFF;
      color: #666;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
      text-transform: lowercase;
      font-size: 16.1px; /* increased by 15% */
      overflow-x: hidden;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* left align */
      gap: 50px;
    }

    header {
      /* no big heading */
      width: 100%;
    }

    .sections-row {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 40px;
    }

    .section {
      color: #666;
      -webkit-text-stroke: 0.5px #808080;
      text-stroke: 0.5px #808080;
      padding-left: 10px;
      width: 100%;
    }

    .section-title {
      font-size: 2.35em;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: lowercase;
      color: transparent;
      -webkit-text-stroke: 0.5px #808080;
      text-stroke: 0.5px #808080;
    }

    .section a {
      text-decoration: none;
      color: #666;
      display: block;
      margin-bottom: 5px;
      transition: all 0.3s ease-in-out;
    }

    .section.writing a {
      color: #666;
    }

    @keyframes rainbow {
      0% { color: red; }
      14% { color: orange; }
      28% { color: yellow; }
      42% { color: green; }
      57% { color: blue; }
      71% { color: indigo; }
      85% { color: violet; }
      100% { color: red; }
    }

    .section a:hover {
      animation: rainbow 1s infinite;
    }

    nav {
      text-align: center;
      font-size: 14px;
      margin-top: 50px;
      width: 100%;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: flex-start; /* align left */
      gap: 20px;
    }

    nav ul li {
      display: inline;
    }

    nav ul li a {
      text-decoration: none;
      color: #666;
      font-weight: bold;
    }

    .gif-container {
      text-align: center;
      width: 100%;
    }

    .gif-container img {
      width: 100px;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="container">

    <header>
      <!-- Big Chris Carroll heading removed -->
    </header>

    <div class="sections-row">

      <!-- Writing Section -->
      <div class="section writing">
        <div class="section-title">writing</div>
        <a href="https://charm-school.net/chriscarroll-moles" target="_blank">Moles</a>
        <a href="https://chris1.substack.com/p/i-am-a-straight-guy?utm_source=profile&utm_medium=reader2" target="_blank">I Am A Straight Guy</a>
        <a href="https://chriscarroll.uk/writing" target="_blank">writings i host on this website</a>
      </div>

      <!-- Sound Section -->
      <div class="section">
        <div class="section-title">sound</div>
        <a href="https://heartsoft.bandcamp.com/" target="_blank">Heartsoft project</a>
      </div>

      <!-- Visual Art Section -->
      <div class="section">
        <div class="section-title">visual art</div>
        <a href="#" target="_blank">photo</a>
        <a href="#" target="_blank">graphic art</a>
        <a href="#" target="_blank">drawing</a>
      </div>

    </div>

    <div class="gif-container">
      <img src="https://www.zingerbug.com/Comments/glitter_graphics/framed_glitter_kitty_face_metallic.gif" alt="Glitter Kitty Face GIF">
    </div>

    <footer>
      <nav>
        <ul>
          <!-- Home link removed as requested -->
        </ul>
      </nav>
    </footer>

  </div>

</body>
</html>
