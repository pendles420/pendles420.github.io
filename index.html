<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="https://i.ibb.co/XrD9y8Jq/e2072737-0213-4668a900-77ac19758edb.jpg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chris Carroll's website</title>
  <style>
    body {
      font-family: 'Helvetica', sans-serif;
      background-color: #FFFFFF;
      color: #666;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
      text-transform: lowercase;
      font-size: 16.1px;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 50px;
    }

    header {
      width: 100%;
    }

    .sections-row {
      display: flex;
      flex-direction: row;
      width: 100%;
      gap: 40px;
    }

    .section {
      color: #666;
      padding-left: 10px;
      flex: 1;
    }

    .section-title {
      font-size: 2.35em;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: lowercase;
      color: transparent;
      -webkit-text-stroke: 0.5px #808080;
      text-stroke: 0.5px #808080;
    }

    .section a {
      text-decoration: none;
      color: #666;
      font-weight: normal;
      -webkit-text-stroke: 0;
      text-stroke: 0;
      display: block;
      margin-bottom: 5px;
      transition: color 0.3s ease-in-out;
    }

    .section a:hover {
      color: #0000FF; /* error 404 blue */
    }

    nav {
      text-align: center;
      font-size: 14px;
      margin-top: 50px;
      width: 100%;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: flex-start;
      gap: 20px;
    }

    nav ul li {
      display: inline;
    }

    nav ul li a {
      text-decoration: none;
      color: #666;
      font-weight: normal;
      -webkit-text-stroke: 0;
      text-stroke: 0;
    }

    nav ul li a:hover {
      color: #0000FF; /* error 404 blue */
    }

    .gif-container {
      text-align: center;
      width: 100%;
    }

    .gif-container img {
      width: 100px;
      height: auto;
    }

    .about-link {
      font-size: 10px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }

    .about-link a {
      color: #666;
      text-decoration: none;
      transition: color 0.3s ease-in-out;
    }

    .about-link a:hover {
      color: #0000FF; /* error 404 blue */
    }
  </style>
</head>
<body>

  <div class="container">

    <header>
        <div class="gif-container">
      <img src="https://imgur.com/sHUdHUp" alt="chris carroll's website" />
    </header>

    <div class="sections-row">

      <!-- Writing Section -->
      <div class="section writing">
        <div class="section-title">writing</div>
        <a href="https://chris1.substack.com/p/a-comprehensive-and-encyclopedic" target="_blank" rel="noopener noreferrer">A Comprehensive and Encyclopedic Dictionary of Human Experiences (2025)</a>
        <a href="https://charm-school.net/chriscarroll-moles" target="_blank" rel="noopener noreferrer">Moles (2025)</a>
        <a href="https://chris1.substack.com/p/i-am-a-straight-guy?utm_source=profile&utm_medium=reader2" target="_blank" rel="noopener noreferrer">I Am A Straight Guy (2024)</a>
        <a href="https://x.com/ihavedisease" target="_blank" rel="noopener noreferrer">twitter</a>
      </div>

      <!-- Sound Section -->
      <div class="section">
        <div class="section-title">sound</div>
        <a href="https://heartsoft.bandcamp.com/" target="_blank" rel="noopener noreferrer">Heartsoft music project</a>
         <a href="https://soundcloud.com/heartsoft/" target="_blank" rel="noopener noreferrer">"a subordinate god" music project</a>
      </div>

      <!-- Other Section -->
      <div class="section">
        <div class="section-title">other</div>
        <a href="https://chriscarroll.uk/photo.html" target="_blank" rel="noopener noreferrer">digital camera photography</a>
        <a href="https://www.youtube.com/watch?v=nMn7dibdHks" target="_blank" rel="noopener noreferrer">Relaxing Google Earth Exploration Video (2023) </a>
        <a href="https://www.tiktok.com/@ihavecrohnsdisease?lang=en" target="_blank" rel="noopener noreferrer">tiktok account</a>
        
      </div>

    </div>

    <div class="gif-container">
      <img src="https://pbs.twimg.com/media/GWiCasnWUAk31V7?format=png&name=900x900" alt="Glitter Kitty Face GIF" />
      <div class="about-link">
        <a href="https://chriscarroll.uk/about" target="_blank" rel="noopener noreferrer">about</a>
      </div>
    </div>

    <footer>
      <nav>
        <ul>
          <!-- No home link -->
        </ul>
      </nav>
    </footer>

  </div>

</body>
</html>
