function getHourBlock(timeStr) {
  const [time, period] = timeStr.split(" ");
  let [h, m] = time.split(":").map(Number);
  if (period === "PM" && h !== 12) h += 12;
  if (period === "AM" && h === 12) h = 0;
  return h;
}

function formatHourLabel(hour24) {
  if (hour24 === 0) return "12 am";
  if (hour24 < 12) return hour24 + " am";
  if (hour24 === 12) return "12 pm";
  return (hour24 - 12) + " pm";
}

const groups = {};

  const h = getHourBlock(time);
  if (!groups[h]) groups[h] = [];
  groups[h].push({time, text});
});

const timeline = document.getElementById('timeline');
const sortedHours = Object.keys(groups).map(Number).sort((a,b) => {
  const wrap = x => x < 17 ? x + 24 : x;
  return wrap(a) - wrap(b);
});

sortedHours.forEach(h => {
  const section = document.createElement('div');
  section.className = 'section';

  const label = document.createElement('div');
  label.className = 'hour-label';
  label.textContent = formatHourLabel(h);
  section.appendChild(label);

  const entries = groups[h];

    const row = document.createElement('div');
    row.className = 'entry';

    const timeSpan = document.createElement('span');
    timeSpan.className = 'entry-time';
    timeSpan.textContent = e.time.toLowerCase();

    const textSpan = document.createElement('span');
    textSpan.className = 'entry-text';
    textSpan.textContent = e.text;

    row.appendChild(timeSpan);
    row.appendChild(textSpan);
    section.appendChild(row);
  });

  timeline.appendChild(section);
});

}
