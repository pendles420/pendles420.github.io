<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="https://i.ibb.co/XrD9y8Jq/e2072737-0213-4668a900-77ac19758edb.jpg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chris Carroll's website</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #fff;
      color: #666;
      font-size: 14.1px;
      line-height: 1.6;
      text-transform: lowercase;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: #0000EE;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ── Layout ── */
    .wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    aside {
      width: 220px;
      min-width: 220px;
      padding: 32px 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-right: none;
    }

    aside .header-img {
      width: 120px;
      height: auto;
      display: block;
      margin-bottom: 28px;
    }

    aside nav {
      font-size: 13px;
      line-height: 2.2;
    }

    aside nav a {
      display: block;
      color: #111;
      font-weight: 400;
    }

    aside nav a:hover {
      color: #0000EE;
      text-decoration: none;
    }

    aside .kitty {
      margin-top: auto;
      padding-top: 24px;
    }

    aside .kitty img {
      width: 80px;
      height: auto;
      display: block;
    }

    aside .about-link {
      font-size: 10px;
      margin-top: 6px;
    }

    aside .about-link a {
      color: #666;
    }

    /* Main content */
    main {
      flex: 1;
      padding: 32px 40px 60px 40px;
    }

    .sections-row {
      display: flex;
      flex-direction: row;
      gap: 60px;
    }

    .section {
      flex: 1;
      max-width: 340px;
    }

    .section-title {
      font-size: 2em;
      font-weight: 400;
      color: transparent;
      -webkit-text-stroke: 0.6px #808080;
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .section a {
      display: block;
      color: #666;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .section a:hover {
      color: #0000EE;
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .sections-row {
        flex-direction: column;
        gap: 36px;
      }
    }

    @media (max-width: 600px) {
      aside {
        width: 160px;
        min-width: 160px;
        padding: 20px 16px;
      }
      main {
        padding: 20px 16px 40px;
      }
    }

    @media (max-width: 480px) {
      .wrapper { flex-direction: column; }
      aside {
        width: 100%;
        height: auto;
        position: static;
        padding: 20px;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 20px;
      }
      aside .kitty { margin-top: 0; }
    }
  </style>
</head>
<body>

        alt="kitty"
      />
    </div>
  </aside>

  <main>

      </div>
