<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shirt</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .wrap {
      text-align: center;
    }

    .title {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 14px;
      opacity: 0.6;
    }

    .dot {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">Shirt</div>
    <div class="sub">Redirecting<span class="dot">.</span></div>
  </div>

  <script>
    setTimeout(function () {
      window.location.href = "https://ihavecrohnsdisease.creator-spring.com/";
    }, 500);
  </script>
</body>
</html>
